<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Quiz</title>
    <link rel="icon" href="./asset/logo.jpg" type="jpg">
    <link rel="stylesheet" href="./styleQuiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <img id="logobranch" src="./asset/logobranch.png"></img>
    
    <div id="game_container">
        <div id="header">
            <button class="btn_quiz" onclick="quitGame()">Quit</button>
            <div id="score_board">SCORE: <span id="score">0</span></div>
        </div>

        <div id="question_container">
            <div id="target_kana">あ</div>
        </div>

        <div id="options_grid">
            <button class="option_btn" onclick="checkAnswer(this)">a</button>
            <button class="option_btn" onclick="checkAnswer(this)">i</button>
            <button class="option_btn" onclick="checkAnswer(this)">u</button>
            <button class="option_btn" onclick="checkAnswer(this)">e</button>
        </div>
    </div>

    <script src="./quiz.js"></script>
</body>
</html>
