<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<link rel="stylesheet" href="./asset/styleBubble.css">
	</head>
	<body>

	
    <div id="leftHandle" class="game-handle">
        <div class="d-pad">
            <div class="d-pad-btn up"></div>
            <div class="d-pad-btn down"></div>
            <div class="d-pad-btn left"></div>
            <div class="d-pad-btn right"></div>
            <div class="d-pad-center"></div>
        </div>
    </div>
    <div id="rightHandle" class="game-handle right-side">
        <div class="action-buttons">
            <div class="action-btn x">X</div>
            <div class="action-btn y">Y</div>
            <div class="action-btn a">A</div>
            <div class="action-btn b">B</div>
        </div>
    </div>

    <div id="pauseOverlayB" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 100; color: white; font-size: 15vh; text-align: center; line-height: 100vh; font-family: 'Lucida Sans', sans-serif; font-weight: bold; text-shadow: 0 0 20px #fff;">
        PAUSED
    </div>

	<div id="onMobile">Set your pc screen in full size to play<br><br>
		<img src="./assetBubble/troll.png" alt="#">
	</div>
	<div id="menu">
		<button id="play" class="buttonbubble">Play</button>
		<button id="setting" class="buttonbubble">Setting</button>
		<button id="guide" class="buttonbubble">Guide</button>
		<button id="quit" class="buttonbubble">Quit</button>
		
		<div id="settingtableb" class="tableb">
			<button class="backbuttonb">&#11178 Back</button>
			<p>Setting</p>
			<div class="settinglineb">
				Type:
				<input type="radio" id="settinghirab" checked="true" name="table">
				<label for="settinghirab">Hiragana&nbsp;&nbsp;</label>
				<input type="radio" id="settingkatab" name="table">
				<label for="settingkatab">Katakana</label>
			</div>
		</div>
		<div id="guidetableb" class="tableb">
			<button class="backbuttonb">&#11178 Back</button>
			<h4>Guide</h4>
			<p><br>Break the bubbles and win by finding and clicking on the letters in the bubbles as required</p>
		</div>
	</div>
	<div id="tip">Welcome to BubbleClick</div>
	<button id="pausebutton">Quit</button>
	<button id="realPauseBtn" onclick="togglePauseBubble()" style="display: none;">||</button>
	<div id="timecal">0s</div>
	<button id="playagain" class="buttonbubble" onclick="myGameArea.restart()">Play Again</button>
	</body>
	<script src="Bubble.js"></script>
	<script src="characterBubble.js"></script>
</html>
