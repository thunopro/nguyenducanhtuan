<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese learning game</title>
    <link rel="icon" href="./asset/logo.jpg"  type="jpg">
    <link rel="stylesheet" href="./stylemenu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div id="wrapper">
        <!-- block bên trái, bên phải, bên trên gồm name, logo và dòng choose a game to start -->
        <div class="title">
            <h1>Japanese learning game</h1>
        </div>
        <div class="btn" id="gameoption" onclick="gameoption()">Game Option</div>
        <div class="btn" id="flashcard" onclick="flashcardOnclick()">Learning Card</div>
        <div class="btn" id="introduce_btn" onclick="introduceOnclick()">Introduce</div>
        <div class="btn" id="mario" onclick="marioOnclick()">Mario Hunter</div>
        <div class="btn" id="bubble" onclick="bubbleOnclick()">Bubble Click</div>
        <div class="btn" id="back" onclick="backOnclick()">Back</div>
        <img id="wcball" src="./asset/wc2026_ball_transparent.png" onclick="showContact()"></img>
        <div id="contactwaifu">
            <div id="contact_container">
                <i class="fa fa-envelope" id="contactwaifu_gmail" style="font-size:1.5vw;color:rgb(0, 0, 23)"></i>
                <p id="linkgml">nguyenducanhtuan@gmail.com</p>
            </div>
        </div>
        <div id="introduce_panel">
            <button class="close_btn" onclick="closeIntroduce()">X</button>
            <h2>About This Game</h2>
            <p>Welcome to the ultimate Japanese Learning Game.</p>
            <p>Awaken your ego and master Japanese through intense mini-games like Mario Hunter and Bubble Click!</p>
        </div>
        </div>
        <img id="logobranch" src="./asset/logobranch.png"></img>
        <img id="logo_hust" src="./asset/logo_hust.svg" alt="HUST Logo"></img>
    </div>
    <script>
        function showContact() {
            document.getElementById("contactwaifu").style.display = "block";
            document.getElementById("wcball").style.display = "none";
            
            var audio = document.createElement("audio");
            audio.src = "./asset/contactvoice.mp3";
            audio.play();
        }
        function gameoption(){
            document.getElementById("mario").style.display = "block";
            document.getElementById("bubble").style.display = "block";
            document.getElementById("back").style.display = "block";
            document.getElementById("flashcard").style.display = "none";
            document.getElementById("gameoption").style.display = "none";
            document.getElementById("introduce_btn").style.display = "none";
        }
        function introduceOnclick(){
            document.getElementById("introduce_panel").style.display = "block";
        }
        function closeIntroduce(){
            document.getElementById("introduce_panel").style.display = "none";
            clickAudio.currentTime = 0;
            clickAudio.play();
        }
        function marioOnclick(){
            setTimeout(() => window.location.href = "indexMario.html", 300);
        }
        function bubbleOnclick(){
            setTimeout(() => window.location.href = "indexBubble.html", 300);
        }
        function flashcardOnclick(){
            setTimeout(() => window.location.href = "indexHiracard.html", 300);
        }
        function backOnclick(){
            document.getElementById("mario").style.display = "none";
            document.getElementById("bubble").style.display = "none";
            document.getElementById("back").style.display = "none";
            document.getElementById("flashcard").style.display = "block";
            document.getElementById("gameoption").style.display = "block";
            document.getElementById("introduce_btn").style.display = "block";
        }

        const clickAudio = new Audio('./asset/bluelock_click.wav');
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                clickAudio.currentTime = 0;
                clickAudio.play();
            });
        });
    </script>
</body>
</html>
