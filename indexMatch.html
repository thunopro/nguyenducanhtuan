<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Match</title>
    <link rel="icon" href="./asset/logo.jpg" type="jpg">
    <link rel="stylesheet" href="./styleMatch.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    
    <div id="game_container">
        <h1>Kana Match</h1>
        <div id="controls">
            <button class="btn_match" onclick="startGame()">Restart</button>
            <button class="btn_match" onclick="quitGame()">Quit</button>
        </div>
        
        <div id="grid">
            <!-- Cards will be generated here by JavaScript -->
        </div>
        
        <div id="win_message" style="display: none;">
            <h2>You Win!</h2>
            <p>Ego Awakened!</p>
            <button class="btn_match" onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script src="./match.js"></script>
</body>
</html>
